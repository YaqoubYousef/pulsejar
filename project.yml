name: PulseJar
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PulseJarCore:
    path: Packages/PulseJarCore

targets:
  PulseJar:
    type: application
    platform: iOS
    sources:
      - path: PulseJar
    dependencies:
      - package: PulseJarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.pulsejar
        PRODUCT_NAME: PulseJar
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: PulseJar
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: Lets the app tell you when a bank message needs your review.
        CODE_SIGN_STYLE: Automatic

schemes:
  PulseJar:
    build:
      targets:
        PulseJar: all
