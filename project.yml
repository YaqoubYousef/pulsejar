name: Finance
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  FinanceCore:
    path: Packages/FinanceCore

targets:
  Finance:
    type: application
    platform: iOS
    sources:
      - path: FinanceApp
    dependencies:
      - package: FinanceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.finance
        PRODUCT_NAME: Finance
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: Lets the app tell you when a bank message needs your review.
        CODE_SIGN_STYLE: Automatic

schemes:
  Finance:
    build:
      targets:
        Finance: all
