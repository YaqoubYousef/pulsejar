name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-parser:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Run parser tests
        run: swift test --package-path Packages/FinanceCore

  build-ipa:
    needs: test-parser
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project Finance.xcodeproj \
            -scheme Finance \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Finance.app Payload/
          zip -qry Finance.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Finance-ipa
          path: Finance.ipa
          retention-days: 30
