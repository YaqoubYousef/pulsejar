name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the job can create GitHub Releases.
permissions:
  contents: write

# Don't let two builds race to publish a release.
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-parser:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Run parser tests
        run: swift test --package-path Packages/PulseJarCore

  build-ipa:
    needs: test-parser
    runs-on: macos-15
    env:
      # Every build gets a higher version so SideStore offers it as an update.
      APP_VERSION: 1.0.${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
      RELEASE_TAG: build-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project PulseJar.xcodeproj \
            -scheme PulseJar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PulseJar.app Payload/
          zip -qry PulseJar.ipa Payload

      - name: Write SideStore source
        run: python3 .github/scripts/make_source.py PulseJar.ipa apps.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" PulseJar.ipa apps.json \
            --target "$GITHUB_SHA" \
            --title "PulseJar $APP_VERSION" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: PulseJar-ipa
          path: PulseJar.ipa
          retention-days: 30
